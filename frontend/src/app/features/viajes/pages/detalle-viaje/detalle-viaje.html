<!-- Botón de volver de Julia -->
<a class="volver" routerLink="/viajes">
  <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m12 19-7-7 7-7" />
    <path d="M19 12H5" />
  </svg>
  Mis viajes
</a>

<!-- Cabecera de Julia con los datos reales -->
<div class="cabecera">
  <div>
    <p class="apagado">{{ viaje.pais }}</p>
    <h1>{{ viaje.origen }} - {{ viaje.destino }}</h1>
    <p class="apagado">{{ viaje.fechas }} · {{ viaje.dias }} días · {{ viaje.viajeros }} viajeros</p>
  </div>
  <span class="pastilla" [class.pastilla-gris]="viaje.estado === 'Finalizado'">{{ viaje.estado }}</span>
</div>

<!-- Botones de Editar y Borrar de Julia -->
<div class="acciones">
  <button type="button" class="boton boton-secundario">
    <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
    </svg>
    Editar
  </button>
  <button type="button" class="boton boton-peligro">
    <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 6h18" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
    </svg>
    Borrar
  </button>
</div>

<!-- NUESTRA BOTONERA DE NAVEGACIÓN -->
<nav class="navegacion-secciones">
  <a routerLink="informacion" routerLinkActive="activo" class="btn-seccion">Información</a>
  <a routerLink="itinerario" routerLinkActive="activo" class="btn-seccion">Itinerario</a>
  <a routerLink="tareas" routerLinkActive="activo" class="btn-seccion">Tareas</a>
  <a routerLink="gastos" routerLinkActive="activo" class="btn-seccion">Gastos</a>
  <a routerLink="documentos" routerLinkActive="activo" class="btn-seccion">Documentos</a>
</nav>

<!-- EL CONTENEDOR DINÁMICO (Aquí se carga la sección que pulses) -->
<main class="contenido-dinamico">
  <router-outlet></router-outlet>
</main>
